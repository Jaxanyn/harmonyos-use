name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

concurrency:
  group: harmonyos-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: matrix.node == '20.x'
        run: npm ci
      - if: matrix.node == '22.x'
        run: npm ci --engine-strict
      - run: npm run check
      - run: npm run check:browser
      - run: npm pack --dry-run
